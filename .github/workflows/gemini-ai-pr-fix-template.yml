name: 'Gemini AI PR 修正 (Gemini AI PR Fix Shared Workflow)'

# =============================================================================
# 概要 (Overview)
# -----------------------------------------------------------------------------
# PR へのコメントで起動し、PR ブランチに修正コミットを push する。
#   /ai-fix [追加の指示]   失敗した CI のログを AI（Aider + Gemini）が解析して修正する
#   /ai-bump patch|minor   バージョンを更新する（AI は使わない。種別は人が判断する）
#
# 動作 (Behavior)
#   - 対象は PR の最新コミットで失敗した CI（ワークフローごとの最新実行）
#   - バージョンチェックの失敗は AI に直させず、/ai-bump の使い方を PR にコメントする
#   - AI による修正（ai-N）と検証（verify-N: Lint → テスト → ビルド）を交互に行い、検証が失敗したら
#     そのログを次の回の AI に渡して再修正する（最大 max_fix_rounds 回。上限 3）
#   - push 後、GITHUB_TOKEN の push では CI が起動しないため、完了済みの全ワークフローを
#     workflow_dispatch で再実行する
#   - 状況表示（👀 リアクション + 状況コメント）は受付・作業開始・作業完了・push・完了の時点で更新する
#
# ジョブ構成と実行境界 (Jobs & Execution Boundaries)
#   ジョブ        GitHub トークン  Gemini キー  PR のコード実行
#   acknowledge   issues/PR 書込   なし         しない    受付通知
#   prepare       読み取りのみ     なし         しない    PR 情報・CI ログの収集、指示文の作成
#   ai-N          なし             あり         しない    Aider で修正（テストなし、.env / .aider* 設定は退避）
#   verify-N      なし             なし         する      npm ci と Lint → テスト → ビルド
#   bump          なし             なし         する      update-version によるバージョン更新
#   publish       書き込み         なし         しない    結果を検証し、patch を適用して push・報告
#   PR のコード（依存パッケージを含む）は GITHUB_ENV / GITHUB_PATH / BASH_ENV / .git/config /
#   プロセスのメモリを通じて同じジョブの後続ステップに影響し得るため、キーとトークンは
#   PR のコードを実行しない別ジョブ（別ランナー）にだけ渡す。ジョブ間は artifact（patch・ログ）で受け渡す。
#   - コメント起動は author_association が allowed_associations に含まれる場合のみ
#   - フォークからの PR は対象外
#   - .github/workflows/ の変更は push しない（GITHUB_TOKEN では push できない）
#   - 作業中は状況コメントを更新しない（作業系ジョブはコメントを書く権限を持たないため）
#
# 呼び出し側の前提 (Caller Requirements)
#   - permissions: contents / issues / pull-requests / actions すべて write
#     （各ジョブは必要な権限だけに絞り込む）
#   - CI の再実行には、対象ワークフローに workflow_dispatch トリガーが必要
# =============================================================================

on:
  workflow_call:
    inputs:
      model_name:
        description: '使用する Gemini モデル名（gemini/ プレフィックスは不要）'
        required: false
        type: string
        default: 'gemini-3.5-flash-lite'
      test_command:
        description: '修正の検証に使うテストコマンド（Lint・ビルドと組み合わせて実行。空ならテストなし）'
        required: false
        type: string
        default: 'npm test'
      node_version:
        description: '使用する Node.js のバージョン（統一値: lts/*）'
        required: false
        type: string
        default: 'lts/*'
      aider_version:
        description: 'インストールする aider-chat のバージョン（固定）'
        required: false
        type: string
        default: '0.86.2'
      max_retries:
        description: '429 レートリミット時の最大試行回数'
        required: false
        type: number
        default: 4
      initial_delay:
        description: 'リトライ初回の待機秒数（以降 2 倍ずつ増加）'
        required: false
        type: number
        default: 30
      max_fix_rounds:
        description: 'AI による修正と検証の最大往復回数（1〜3）'
        required: false
        type: number
        default: 3
      allowed_associations:
        description: 'コメント起動を許可する author_association（カンマ区切り・空白なし）'
        required: false
        type: string
        default: 'OWNER,MEMBER,COLLABORATOR'
      timeout_minutes:
        description: 'AI ジョブ 1 回あたりのタイムアウト（分）'
        required: false
        type: number
        default: 30
    secrets:
      GEMINI_API_KEY:
        description: 'Google AI Studio の API キー（/ai-bump のみの利用でも必須）'
        required: true

jobs:
  # 受付通知: concurrency の順番待ちの外で即座に 👀 と状況コメントを出す
  acknowledge:
    name: '受付通知 (Acknowledge Request)'
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.actor != 'github-actions[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.sender.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/ai-fix') || startsWith(github.event.comment.body, '/ai-bump')) &&
      contains(format(',{0},', inputs.allowed_associations), format(',{0},', github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    outputs:
      # 有効な /ai-fix・/ai-bump patch|minor のときだけ true（後続のジョブはこれで判定する）
      valid: ${{ steps.cmd.outputs.kind == 'fix' || steps.cmd.outputs.kind == 'bump' }}
      comment_id: ${{ steps.ack.outputs.comment_id }}
      reaction_id: ${{ steps.ack.outputs.reaction_id }}
    steps:
      # 上の if は粗い絞り込み。コマンドの境界（/ai-fixx 等を除外）は共通の定義で判定する。
      # 解釈できないコマンドはヘルプ（gemini-ai-help-template.yml）が案内する
      - name: 'コマンドの判定 (Classify Command)'
        id: cmd
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-command@v1

      - name: '受付リアクションと状況コメントの投稿 (Post Acknowledgement)'
        id: ack
        if: ${{ steps.cmd.outputs.kind == 'fix' || steps.cmd.outputs.kind == 'bump' }}
        continue-on-error: true
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent-status@v1
        with:
          mode: ack
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 作業系ジョブは状況コメントを書く権限を持たないため、ここで「作業中」にしておく
      - name: '状況表示: 作業ジョブで処理中 (Status: Working)'
        if: ${{ steps.ack.outputs.comment_id != '' }}
        continue-on-error: true
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent-status@v1
        with:
          mode: update
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_comment_id: ${{ steps.ack.outputs.comment_id }}
          headline: '⚙️ 作業ジョブで処理中'
          detail: 'CI ログの解析、AI による修正と検証（失敗した場合は検証ログをもとに最大 3 回まで再修正）を行っています。/ai-bump ではバージョンを更新しています。同じ PR への依頼は準備（CI ログの収集）だけを順番に行い、前の処理の完了は待ちません。並行して動いた場合、後から終わった処理は PR ブランチが先に更新されているため push を中止することがあります。安全のため作業中は状況を更新しません（数分〜数十分かかります）。進み具合は実行ログで確認できます。'

  # 準備: PR 情報と CI ログを集める。読み取りトークンのみ・PR のコードは実行しない
  prepare:
    name: '準備 (Prepare)'
    needs: acknowledge
    if: ${{ needs.acknowledge.outputs.valid == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # 同一 PR への依頼は準備（このジョブ）だけを順番に行う。後続の ai / verify / publish は
    # 直列化しないため、前の処理の完了は待たない。並行した場合、後から終わった publish は
    # head の照合（push_and_report.sh）で push を中止する
    concurrency:
      group: gemini-ai-pr-fix-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      bump_type: ${{ steps.prepare.outputs.bump_type }}
      head_ref: ${{ steps.prepare.outputs.head_ref }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      base_ref: ${{ steps.prepare.outputs.base_ref }}
      action: ${{ steps.prepare.outputs.action }}
      pending_count: ${{ steps.prepare.outputs.pending_count }}
      rerun_workflows: ${{ steps.prepare.outputs.rerun_workflows }}
      verify_command: ${{ steps.prepare.outputs.verify_command }}
    steps:
      - name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false

      - name: 'PR 情報と CI ログの収集 (Collect PR & CI Info)'
        id: prepare
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: prepare
          test_command: ${{ inputs.test_command }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  # バージョン更新: PR のコード（update-version）を実行する。キー・書き込みトークンなし
  bump:
    name: 'バージョン更新 (Bump Version)'
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'bump' && needs.prepare.outputs.action == 'patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.bump.outputs.has_patch }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          # ベースブランチのバージョンと比較するため全履歴を取得する
          fetch-depth: 0
          persist-credentials: false
      - name: 'バージョンの更新 (Bump Version)'
        id: bump
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: bump
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          base_ref: ${{ needs.prepare.outputs.base_ref }}
          bump_type: ${{ needs.prepare.outputs.bump_type }}
          node_version: ${{ inputs.node_version }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  # ---- 1 回目: AI（キーあり・コード実行なし）→ 検証（キーなし・コード実行あり） ----
  ai-1:
    name: 'AI による修正 1 回目 (AI Fix Round 1)'
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'fix' && needs.prepare.outputs.action == 'patch' && inputs.max_fix_rounds >= 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ai.outputs.changed }}
      attempts: ${{ steps.ai.outputs.attempts }}
    steps:
      - uses: actions/checkout@v4
        name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - name: 'AI による修正 (AI Fix)'
        id: ai
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: ai
          round: '1'
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          model_name: ${{ inputs.model_name }}
          aider_version: ${{ inputs.aider_version }}
          max_retries: ${{ inputs.max_retries }}
          initial_delay: ${{ inputs.initial_delay }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  verify-1:
    name: '修正の検証 1 回目 (Verify Round 1)'
    needs: [prepare, ai-1]
    if: ${{ needs.ai-1.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - name: '修正の検証 (Verify)'
        id: verify
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: verify
          round: '1'
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          node_version: ${{ inputs.node_version }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  # ---- 2 回目: 1 回目の検証が失敗した場合のみ ----
  ai-2:
    name: 'AI による修正 2 回目 (AI Fix Round 2)'
    needs: [prepare, ai-1, verify-1]
    if: ${{ needs.verify-1.outputs.status == 'failed' && inputs.max_fix_rounds >= 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ai.outputs.changed }}
      attempts: ${{ steps.ai.outputs.attempts }}
    steps:
      - uses: actions/checkout@v4
        name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - name: 'AI による修正 (AI Fix)'
        id: ai
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: ai
          round: '2'
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          model_name: ${{ inputs.model_name }}
          aider_version: ${{ inputs.aider_version }}
          max_retries: ${{ inputs.max_retries }}
          initial_delay: ${{ inputs.initial_delay }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  verify-2:
    name: '修正の検証 2 回目 (Verify Round 2)'
    needs: [prepare, ai-2]
    if: ${{ needs.ai-2.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - name: '修正の検証 (Verify)'
        id: verify
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: verify
          round: '2'
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          node_version: ${{ inputs.node_version }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  # ---- 3 回目: 2 回目の検証が失敗した場合のみ ----
  ai-3:
    name: 'AI による修正 3 回目 (AI Fix Round 3)'
    needs: [prepare, ai-2, verify-2]
    if: ${{ needs.verify-2.outputs.status == 'failed' && inputs.max_fix_rounds >= 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ai.outputs.changed }}
      attempts: ${{ steps.ai.outputs.attempts }}
    steps:
      - uses: actions/checkout@v4
        name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - name: 'AI による修正 (AI Fix)'
        id: ai
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: ai
          round: '3'
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          model_name: ${{ inputs.model_name }}
          aider_version: ${{ inputs.aider_version }}
          max_retries: ${{ inputs.max_retries }}
          initial_delay: ${{ inputs.initial_delay }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  verify-3:
    name: '修正の検証 3 回目 (Verify Round 3)'
    needs: [prepare, ai-3]
    if: ${{ needs.ai-3.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - name: '修正の検証 (Verify)'
        id: verify
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: verify
          round: '3'
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          node_version: ${{ inputs.node_version }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}

  # 公開: 書き込み権限を持つ。PR のコードは実行せず、作業系ジョブの結果を検証して push する
  publish:
    name: '公開 (Publish: Push & Report)'
    needs: [acknowledge, prepare, bump, ai-1, verify-1, ai-2, verify-2, ai-3, verify-3]
    if: ${{ always() && needs.acknowledge.result == 'success' && needs.acknowledge.outputs.valid == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      # 作業系ジョブとは別のランナーで、PR の head を新しく取得する（状態を引き継がない）
      - name: 'PR ブランチのチェックアウト (Checkout PR Head)'
        if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.action == 'patch' }}
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false

      - name: '作業結果の公開 (Publish Work Result)'
        id: publish
        if: ${{ needs.prepare.result == 'success' }}
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-publish@v1
        with:
          needs_json: ${{ toJSON(needs) }}
          max_rounds: ${{ inputs.max_fix_rounds }}
          mode: ${{ needs.prepare.outputs.mode }}
          bump_type: ${{ needs.prepare.outputs.bump_type }}
          head_ref: ${{ needs.prepare.outputs.head_ref }}
          head_sha: ${{ needs.prepare.outputs.head_sha }}
          work_action: ${{ needs.prepare.outputs.action }}
          pending_count: ${{ needs.prepare.outputs.pending_count }}
          rerun_workflows: ${{ needs.prepare.outputs.rerun_workflows }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          model_name: ${{ inputs.model_name }}
          artifact_prefix: ai-pr-${{ github.run_id }}-${{ github.run_attempt }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_comment_id: ${{ needs.acknowledge.outputs.comment_id }}

      - name: '状況表示: 完了 (Status: Finished)'
        if: ${{ always() }}
        continue-on-error: true
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent-status@v1
        with:
          mode: finish
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_comment_id: ${{ needs.acknowledge.outputs.comment_id }}
          reaction_id: ${{ needs.acknowledge.outputs.reaction_id }}
          result: ${{ needs.prepare.result == 'cancelled' && 'cancelled' || (steps.publish.outcome == 'success' && steps.publish.outputs.result || (steps.publish.outcome == 'cancelled' && 'cancelled' || 'failure')) }}
          pr_url: ${{ steps.publish.outputs.commit_url }}

      # 状況コメントの書き換えでは通知が飛ばないため、失敗は新規コメントで知らせる
      - name: '失敗時の PR 通知 (Notify Failure on PR)'
        if: ${{ always() && (needs.prepare.result == 'failure' || steps.publish.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ Gemini AI エージェントの実行に失敗しました。詳細は実行ログを確認してください。"$'\n\n'"- 実行ログ: ${RUN_URL}"
