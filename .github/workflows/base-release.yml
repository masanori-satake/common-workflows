name: '共通リリース処理 (Base Release)'

# =============================================================================
# 統一パラメータ方針 (Unified Parameters Policy)
# -----------------------------------------------------------------------------
#   - project_name      : リポジトリ名を自動採用（github.event.repository.name）
#   - Node.js           : lts/*
#   - Python            : 3.12         （空文字でPythonセットアップをスキップ）
#   - 依存インストール  : npm ci
#   - Playwright        : requirements.txt 経由 + chromium --with-deps（存在時のみ）
#   - リリース ZIP 名   : package_source_dir 指定時は {project_name}-v{version}.zip に統一（方式A）
#                         未指定時は従来の release_files（既定 releases/*.zip）を使用
#   - アイコン生成      : generate_icons: true で generate-icons action を使用（任意）
#
# リリースはドラフト/リトライ等の作り込みを排し、softprops/action-gh-release の
# 単純な1ステップ添付に統一しています。
# =============================================================================

on:
  workflow_call:
    inputs:
      project_name:
        description: 'プロジェクト識別名（ZIPファイル名プレフィックス。統一値: リポジトリ名）'
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      build_dir:
        description: 'release_files 未指定時に ZIP 化する対象ディレクトリ'
        required: false
        type: string
        default: 'dist'
      release_files:
        description: 'Release へ添付するファイルグロブ（統一値: releases/*.zip）'
        required: false
        type: string
        default: 'releases/*.zip'
      node_version:
        description: '使用するNode.jsのバージョン（統一値: lts/*）'
        required: false
        type: string
        default: 'lts/*'
      python_version:
        description: '使用するPythonのバージョン（統一値: 3.12。空文字でスキップ）'
        required: false
        type: string
        default: '3.12'
      install_command:
        description: |
          依存関係のインストールコマンド。
          空文字（統一値）の場合は lockfile の有無で自動判定する:
            - package-lock.json あり → npm ci（再現性重視）
            - package-lock.json なし → npm install（lockfile 不要な依存ゼロ構成向け）
          明示指定した場合はその値をそのまま使用する。
        required: false
        type: string
        default: ''
      package_source_dir:
        description: |
          リリース ZIP に含める素材ディレクトリ。指定時は base-release 側で
          {project_name}-v{version}.zip を生成する（ZIP 名の統一）。
          空の場合は従来通り release_files（既定 releases/*.zip）を使用する。
        required: false
        type: string
        default: ''
      manifest_rename:
        description: |
          ZIP 内でのファイルリネーム（package_source_dir 指定時のみ有効）。
          形式 "元ファイル名:新ファイル名"（例: manifest.chrome.json:manifest.json）。空なら無し。
        required: false
        type: string
        default: ''
      generate_icons:
        description: 'ビルド前に SVG から PNG アイコンを生成するか（generate-icons composite action を使用）'
        required: false
        type: boolean
        default: false
      icon_svg_path:
        description: 'アイコン生成の入力 SVG パス'
        required: false
        type: string
        default: 'projects/app/assets/icon.svg'
      icon_output_dir:
        description: 'アイコン生成の出力ディレクトリ'
        required: false
        type: string
        default: 'projects/app/icons'
    outputs:
      version:
        description: '抽出されたバージョン番号 (例: 1.2.0)'
        value: ${{ jobs.release.outputs.version }}
      tag_name:
        description: '生成されたタグ名 (例: v1.2.0)'
        value: ${{ jobs.release.outputs.tag_name }}

jobs:
  release:
    name: 'リリースパッケージ作成・公開 (Build & Publish Release)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      tag_name: ${{ steps.extract_version.outputs.tag_name }}

    steps:
      - name: 'コードのチェックアウト (Checkout Code)'
        uses: actions/checkout@v4

      - name: 'lockfile の有無を判定 (Detect Lockfile)'
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # lockfile がある場合のみ npm キャッシュを有効化する（setup-node の npm キャッシュは lockfile 必須のため）
      - name: 'Node.js環境のセットアップ (Setup Node.js, with cache)'
        if: ${{ steps.lockfile.outputs.exists == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: 'Node.js環境のセットアップ (Setup Node.js, no cache)'
        if: ${{ steps.lockfile.outputs.exists == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: 'Python依存ファイルの有無を判定 (Detect Python Deps File)'
        id: pydeps
        if: ${{ inputs.python_version != '' }}
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 依存ファイル（requirements.txt / pyproject.toml）がある場合のみ pip キャッシュを有効化する
      # （setup-python の pip キャッシュはキー算出にこれらのファイルを必須とするため）
      - name: 'Python環境のセットアップ (Setup Python, with cache)'
        if: ${{ inputs.python_version != '' && steps.pydeps.outputs.exists == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: 'Python環境のセットアップ (Setup Python, no cache)'
        if: ${{ inputs.python_version != '' && steps.pydeps.outputs.exists == 'false' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: 'Python依存関係のインストール (Install Python Deps if requirements.txt exists)'
        if: ${{ inputs.python_version != '' }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt が存在しないため Python 依存関係のインストールをスキップします。"
          fi

      - name: 'Playwright(chromium)のインストール (Install Playwright if requirements.txt exists)'
        if: ${{ inputs.python_version != '' }}
        run: |
          if [ -f requirements.txt ] && grep -qi 'playwright' requirements.txt; then
            python3 -m playwright install --with-deps chromium
          else
            echo "requirements.txt に playwright が含まれないため Playwright のインストールをスキップします。"
          fi

      - name: 'アイコン生成 (Generate PNG Icons)'
        if: ${{ inputs.generate_icons }}
        uses: masanori-satake/common-workflows/.github/actions/generate-icons@v1
        with:
          svg_path: ${{ inputs.icon_svg_path }}
          output_dir: ${{ inputs.icon_output_dir }}
          python_version: ${{ inputs.python_version != '' && inputs.python_version || '3.12' }}

      - name: '依存関係のインストールとビルド (Install & Build)'
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
          LOCKFILE_EXISTS: ${{ steps.lockfile.outputs.exists }}
        run: |
          if [ -n "$INSTALL_COMMAND" ]; then
            echo "明示指定されたコマンドを実行します: $INSTALL_COMMAND"
            eval "$INSTALL_COMMAND"
          elif [ "$LOCKFILE_EXISTS" = "true" ]; then
            npm ci
          else
            echo "package-lock.json が存在しないため npm install を使用します。"
            npm install
          fi
          npm run build --if-present

      - name: 'バージョン情報の自動抽出 (Extract Version from Manifest/Package)'
        id: extract_version
        run: |
          node -e '
            const fs = require("fs");
            let version = "";
            const candidates = [
              "projects/app/manifest.json",
              "manifest.json",
              "package.json",
            ];
            let source = "";
            for (const file of candidates) {
              if (fs.existsSync(file)) {
                version = JSON.parse(fs.readFileSync(file, "utf8")).version;
                source = file;
                break;
              }
            }
            if (!source) {
              console.error("Error: No manifest.json or package.json was found.");
              process.exit(1);
            }
            if (!version) {
              console.error(`Error: Version field is missing in ${source}.`);
              process.exit(1);
            }
            const tagName = `v${version}`;
            console.log(`Source: ${source}`);
            console.log(`Extracted Version: ${version}`);
            console.log(`Generated Tag: ${tagName}`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag_name=${tagName}\n`);
          '

      # 方式A: package_source_dir 指定時は共通 action で ZIP 名を統一生成する
      - name: 'リリース用アーカイブの作成 (Create Release ZIP - unified naming)'
        id: package_unified
        if: ${{ inputs.package_source_dir != '' }}
        uses: masanori-satake/common-workflows/.github/actions/package-extension@v1
        with:
          source_dir: ${{ inputs.package_source_dir }}
          zip_name: ${{ inputs.project_name }}-v${{ steps.extract_version.outputs.version }}.zip
          manifest_rename: ${{ inputs.manifest_rename }}

      - name: 'リリース用アーカイブの作成 (Create Release ZIP - legacy/fallback)'
        id: package_legacy
        if: ${{ inputs.package_source_dir == '' }}
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          PROJECT_NAME: ${{ inputs.project_name }}
          BUILD_DIR: ${{ inputs.build_dir }}
          RELEASE_FILES: ${{ inputs.release_files }}
        run: |
          # 従来方式: release_files が既存ファイルにマッチすればそれを使用
          if compgen -G "$RELEASE_FILES" > /dev/null; then
            echo "既存のリリースアーティファクト (${RELEASE_FILES}) を使用します。"
            echo "zip_name=${RELEASE_FILES}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # フォールバック: build_dir があればその中身を、無ければリポジトリ全体を ZIP 化
          ZIP_NAME="${PROJECT_NAME}-v${VERSION}.zip"
          if [ -d "$BUILD_DIR" ]; then
            cd "$BUILD_DIR" && zip -r "../$ZIP_NAME" ./* && cd ..
          else
            zip -r "$ZIP_NAME" . -x "*.git*" "node_modules/*" ".github/*"
          fi
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: 'アセットファイル名の確定 (Resolve Asset File Name)'
        id: package
        env:
          UNIFIED: ${{ steps.package_unified.outputs.zip_name }}
          LEGACY: ${{ steps.package_legacy.outputs.zip_name }}
        run: |
          if [ -n "$UNIFIED" ]; then
            echo "zip_name=${UNIFIED}" >> "$GITHUB_OUTPUT"
          else
            echo "zip_name=${LEGACY}" >> "$GITHUB_OUTPUT"
          fi

      - name: 'GitHub Releaseの作成とアセット添付 (Create GitHub Release)'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_name }}
          name: ${{ inputs.project_name }} ${{ steps.extract_version.outputs.tag_name }}
          files: ${{ steps.package.outputs.zip_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: '実行結果サマリーの出力 (Output Step Summary)'
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 📦 リリースパッケージ作成結果 (Release Package Summary)

          | 項目 (Item) | 設定値 (Value) |
          | :--- | :--- |
          | **抽出バージョン (Version)** | `${{ steps.extract_version.outputs.version }}` |
          | **生成タグ名 (Tag Name)** | `${{ steps.extract_version.outputs.tag_name }}` |
          | **添付アセット (Assets)** | `${{ steps.package.outputs.zip_name }}` |

          ✅ リリースアセットの作成と GitHub Release への登録が完了しました。
          EOF
