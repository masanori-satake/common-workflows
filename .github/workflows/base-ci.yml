name: '共通CI処理 (Base CI)'

# =============================================================================
# 統一パラメータ方針 (Unified Parameters Policy)
# -----------------------------------------------------------------------------
# 呼び出し側の `with:` を極力空にできるよう、Solo エコシステム全体で共通の値を
# 本ワークフローのデフォルトとして閉じ込めています。以下は「固定値」であり、
# 原則として呼び出し側で上書きしません（例外は該当プロジェクトのみ）。
#
#   - Node.js           : lts/*        （常に最新 LTS を追従）
#   - Python            : 3.12         （明示固定。将来は本ファイルで一括更新）
#   - 依存インストール  : npm ci       （package-lock.json 前提・再現性重視）
#   - Python チェック   : scripts/ci_checks.py（存在すれば実行する単一エントリ）
#   - Playwright        : requirements.txt 経由 + chromium --with-deps
#   - Lint / Test       : 全件実行（差分限定の最適化は行わない）
# =============================================================================

on:
  workflow_call:
    inputs:
      node_version:
        description: '使用するNode.jsのバージョン（統一値: lts/*）'
        required: false
        type: string
        default: 'lts/*'
      python_version:
        description: '使用するPythonのバージョン（統一値: 3.12。空文字でPythonセットアップをスキップ）'
        required: false
        type: string
        default: '3.12'
      install_command:
        description: |
          依存関係のインストールコマンド。
          空文字（統一値）の場合は lockfile の有無で自動判定する:
            - package-lock.json あり → npm ci（再現性重視）
            - package-lock.json なし → npm install（lockfile 不要な依存ゼロ構成向け）
          明示指定した場合はその値をそのまま使用する。
        required: false
        type: string
        default: ''
      run_typecheck:
        description: '型チェックを実行するか'
        required: false
        type: boolean
        default: true
      run_lint:
        description: '静的解析(Lint)を実行するか'
        required: false
        type: boolean
        default: true
      run_test:
        description: '単体テストを実行するか'
        required: false
        type: boolean
        default: true

jobs:
  ci:
    name: '品質検証・ビルド (Validate & Build)'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 'コードのチェックアウト (Checkout Code)'
        uses: actions/checkout@v4
        with:
          # バージョン整合性チェックや版バンプ比較のため全履歴を取得する
          fetch-depth: 0

      - name: 'lockfile の有無を判定 (Detect Lockfile)'
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # lockfile がある場合のみ npm キャッシュを有効化する（setup-node の npm キャッシュは lockfile 必須のため）
      - name: 'Node.js環境のセットアップ (Setup Node.js, with cache)'
        if: ${{ steps.lockfile.outputs.exists == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: 'Node.js環境のセットアップ (Setup Node.js, no cache)'
        if: ${{ steps.lockfile.outputs.exists == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: 'Python環境のセットアップ (Setup Python)'
        if: ${{ inputs.python_version != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: 'Python依存関係のインストール (Install Python Deps if requirements.txt exists)'
        if: ${{ inputs.python_version != '' }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt が存在しないため Python 依存関係のインストールをスキップします。"
          fi

      - name: 'Node.js依存関係のインストール (Install Node Dependencies)'
        run: |
          if [ -n "${{ inputs.install_command }}" ]; then
            # 明示指定されたコマンドを優先する
            ${{ inputs.install_command }}
          elif [ "${{ steps.lockfile.outputs.exists }}" = "true" ]; then
            npm ci
          else
            echo "package-lock.json が存在しないため npm install を使用します。"
            npm install
          fi

      - name: 'プロジェクトポリシーチェック (Run Project Policy Checks)'
        run: |
          if [ -f scripts/ci_checks.py ]; then
            python3 scripts/ci_checks.py
          else
            echo "scripts/ci_checks.py が存在しないため共通ポリシーチェックをスキップします。"
          fi

      - name: '型チェックの実行 (Type Check)'
        if: ${{ inputs.run_typecheck }}
        run: npm run typecheck --if-present

      - name: '静的解析の実行 (Lint)'
        if: ${{ inputs.run_lint }}
        run: npm run lint --if-present

      - name: '単体テストの実行 (Test)'
        if: ${{ inputs.run_test }}
        run: npm run test --if-present

      - name: 'ビルドの実行 (Build)'
        run: npm run build --if-present
