name: 'Gemini AI エージェント (Gemini AI Agent Shared Workflow)'

# =============================================================================
# 概要 (Overview)
# -----------------------------------------------------------------------------
# GitHub の Issue / Issue コメントを指示文として、Aider + Gemini API（Google AI
# Studio 無料枠）でコードを修正し、変更があれば Pull Request を作成する。
#
# 統一パラメータ方針 (Unified Parameters Policy)
#   - モデル            : gemini/gemini-3.5-flash-lite
#   - Aider             : aider-chat をバージョン固定でインストール（Python 3.12）
#   - 依存インストール  : 検証ジョブで package.json があれば lockfile 自動判定（npm ci / npm install）
#   - 検証と再修正      : AI の修正（ai-N）と検証（verify-N: Lint → テスト → ビルド）を交互に行い、
#                         検証が失敗したらそのログを次の回の AI に渡して再修正する（最大 max_fix_rounds 回。上限 3）。
#                         最後の検証が失敗した場合は Draft PR として作成する
#   - 429 対策          : 30s → 60s → 120s の指数バックオフで最大 4 回試行
#   - 対象ファイル指定  : 本文の "Files: a.ts, b.ts" 行を抽出（追跡済みファイルのみ）
#   - .aiderignore      : 無ければ自動生成（node_modules/ 等をコンテキストから除外）
#
# ジョブ構成と実行境界 (Jobs & Execution Boundaries) — PR 修正（gemini-ai-pr-fix-template.yml）と同じ
#   ジョブ        GitHub トークン   Gemini キー  リポジトリのコード実行
#   acknowledge   Issue 書込        なし         しない    受付通知
#   prepare       読み取りのみ      なし         しない    指示文・対象ファイルの抽出、検証コマンドの決定
#   ai-N          なし              あり         しない    Aider で修正（テストなし、.env / .aider* 設定は退避）
#   verify-N      なし              なし         する      npm ci と Lint → テスト → ビルド
#   publish       書き込み          なし         しない    結果を検証し、patch を適用してブランチに push・PR 作成・報告
#   AI が変更したコード（テストを含む）や依存パッケージは、GITHUB_ENV / GITHUB_PATH / BASH_ENV / .git/config /
#   プロセスのメモリを通じて同じジョブの後続ステップに影響し得るため、キーとトークンは
#   コードを実行しない別ジョブ（別ランナー）にだけ渡す。ジョブ間は artifact（patch・ログ）で受け渡す。
#
# セキュリティ方針 (Security Policy)
#   - Issue 本文・コメントは ${{ }} で run: に直接埋め込まず、env 経由で受け渡す
#     （スクリプトインジェクション対策）。$GITHUB_ENV へはランダムなデリミタで書き込む。
#   - ボット（*[bot] / sender.type == Bot）による起動を遮断（無限ループ防止）
#   - コメント起動は author_association が allowed_associations に含まれる場合のみ
#     （ラベルを付けられるのは Triage 以上の権限を持つ人のみ）
#   - checkout は persist-credentials: false。コードを実行するジョブ（verify）では npm キャッシュを使わない
#   - .github/workflows/ の変更は作業結果に含めない（GITHUB_TOKEN では push できない）
#
# 状況表示 (Status Display)
#   - acknowledge ジョブが順番待ちの外で即座に 👀 リアクションと状況コメントを投稿し、「作業ジョブで処理中」にする
#   - 作業系ジョブは状況コメントを書く権限を持たないため、作業中は更新しない。publish が作業完了 → PR 作成 → 完了を表示する
#   - 完了時に 👀 を 🚀（成功）/ 😕（失敗・中断）へ切り替え、結果は通知のため新規コメントでも知らせる
#   - Aider のシェルコマンド提案・URL 自動取得は無効化（--yes-always との組合せ対策）
#
# 呼び出し側の前提 (Caller Requirements)
#   - permissions: contents: write / issues: write / pull-requests: write を付与する
#   - リポジトリ設定 "Allow GitHub Actions to create and approve pull requests" を有効化
#   - GITHUB_TOKEN で作成した PR では他のワークフロー（CI）は自動起動しない
#     （GitHub の仕様）。CI を回す場合は PR を一度 close → reopen する。
# =============================================================================

on:
  workflow_call:
    inputs:
      target_branch:
        description: '作業対象のベースブランチ（空ならリポジトリの既定ブランチ）'
        required: false
        type: string
        default: ''
      model_name:
        description: '使用する Gemini モデル名（gemini/ プレフィックスは不要）'
        required: false
        type: string
        default: 'gemini-3.5-flash-lite'
      test_command:
        description: '修正の検証に使うテストコマンド（Lint・ビルドと組み合わせて実行。空ならテストなし）'
        required: false
        type: string
        default: 'npm test'
      node_version:
        description: '使用する Node.js のバージョン（統一値: lts/*）'
        required: false
        type: string
        default: 'lts/*'
      setup_node:
        description: '（互換のため残している入力。現在は未使用。検証ジョブは package.json があれば常に Node.js を準備する）'
        required: false
        type: boolean
        default: true
      aider_version:
        description: 'インストールする aider-chat のバージョン（固定）'
        required: false
        type: string
        default: '0.86.2'
      max_retries:
        description: '429 レートリミット時の最大試行回数'
        required: false
        type: number
        default: 4
      initial_delay:
        description: 'リトライ初回の待機秒数（以降 2 倍ずつ増加）'
        required: false
        type: number
        default: 30
      max_fix_rounds:
        description: 'AI による修正と検証の最大往復回数（1〜3）'
        required: false
        type: number
        default: 3
      allowed_associations:
        description: 'コメント起動を許可する author_association（カンマ区切り・空白なし）'
        required: false
        type: string
        default: 'OWNER,MEMBER,COLLABORATOR'
      command_prefix:
        description: 'コメント起動のコマンドプレフィックス（指示文から除去される）'
        required: false
        type: string
        default: '/ai'
      timeout_minutes:
        description: 'AI ジョブ 1 回あたりのタイムアウト（分）。バックオフ待機を考慮した値'
        required: false
        type: number
        default: 30
    secrets:
      GEMINI_API_KEY:
        description: 'Google AI Studio の API キー（無料枠用）'
        required: true

jobs:
  # 受付通知: concurrency の順番待ちの外で即座に動き、Issue に 👀 と状況コメントを出す。
  # 起動ガードはこのジョブに置き、後続のジョブは needs により同じ条件でのみ動く。
  acknowledge:
    name: '受付通知 (Acknowledge Request)'
    # 無限ループ防止: ボット自身のイベントでは起動しない。
    # PR 上のコメント（issue_comment は PR でも発火する）は対象外。
    # `/ai-` で始まるコメント（/ai-help・/ai-fix 等）は別のワークフローのコマンドなので対象外。
    # コメント起動は command_prefix（既定 /ai）の直後が空白・改行・終端の場合に限る
    # （呼び出し側の startsWith は粗い絞り込みのため、/aider・/aihelp 等もここで除外する）。
    # コメント起動は信頼できる author_association に限定する（シークレット悪用防止）。
    if: >-
      github.actor != 'github-actions[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'issues' ||
        (github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          !startsWith(github.event.comment.body, '/ai-') &&
          (github.event.comment.body == inputs.command_prefix ||
            startsWith(github.event.comment.body, format('{0} ', inputs.command_prefix)) ||
            startsWith(github.event.comment.body, format('{0}{1}', inputs.command_prefix, fromJSON('"\n"'))) ||
            startsWith(github.event.comment.body, format('{0}{1}', inputs.command_prefix, fromJSON('"\r"'))) ||
            startsWith(github.event.comment.body, format('{0}{1}', inputs.command_prefix, fromJSON('"\t"')))) &&
          contains(format(',{0},', inputs.allowed_associations), format(',{0},', github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      comment_id: ${{ steps.ack.outputs.comment_id }}
      reaction_id: ${{ steps.ack.outputs.reaction_id }}
    steps:
      - name: '受付リアクションと状況コメントの投稿 (Post Acknowledgement)'
        id: ack
        # 状況表示は補助機能のため、失敗しても本体の実行は止めない
        continue-on-error: true
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent-status@v1
        with:
          mode: ack
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 作業系ジョブは状況コメントを書く権限を持たないため、ここで「作業中」にしておく
      - name: '状況表示: 作業ジョブで処理中 (Status: Working)'
        if: ${{ steps.ack.outputs.comment_id != '' }}
        continue-on-error: true
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent-status@v1
        with:
          mode: update
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_comment_id: ${{ steps.ack.outputs.comment_id }}
          headline: '⚙️ 作業ジョブで処理中'
          detail: '指示内容の解析、AI による修正と検証（Lint → テスト → ビルド。失敗した場合は検証ログをもとに最大 3 回まで再修正）を行っています。同じ Issue で実行中の処理があれば、その準備の完了を待ってから始めます。Gemini API 無料枠の上限（429）に達した場合は自動で待機して再試行します。安全のため作業中は状況を更新しません（数分〜数十分かかります）。進み具合は実行ログで確認できます。'

  # 準備: 指示文と対象ファイルを抽出する。読み取りトークンのみ・リポジトリのコードは実行しない
  prepare:
    name: '準備 (Prepare)'
    needs: acknowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # 多重実行防止: 同一 Issue への依頼は準備（このジョブ）だけを順番に行う。作業ブランチは実行ごとに
    # 別名のため、後続の ai / verify / publish は直列化しない。実行中のジョブはキャンセルしない。
    # queue: max で待機中のリクエストも置き換えずに順番待ちさせる（既定では待機は 1 件のみ）。
    # 呼び出し側と同名のグループを使うとデッドロックするため、固有のプレフィックスを付ける。
    concurrency:
      group: gemini-ai-agent-${{ github.repository }}-${{ github.event.issue.number || github.ref }}
      cancel-in-progress: false
      queue: max
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      verify_command: ${{ steps.prepare.outputs.verify_command }}
      target_files: ${{ steps.prepare.outputs.target_files }}
    steps:
      - name: 'コードのチェックアウト (Checkout Repository)'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.event.repository.default_branch }}
          persist-credentials: false

      - name: '指示文と対象ファイルの抽出 (Extract Prompt and Target Files)'
        id: prepare
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent@v1
        with:
          stage: prepare
          base_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          test_command: ${{ inputs.test_command }}
          command_prefix: ${{ inputs.command_prefix }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}

  # ---- 1 回目: AI（キーあり・コード実行なし）→ 検証（キーなし・コード実行あり） ----
  ai-1:
    name: 'AI による修正 1 回目 (AI Fix Round 1)'
    needs: prepare
    if: ${{ inputs.max_fix_rounds >= 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ai.outputs.changed }}
      attempts: ${{ steps.ai.outputs.attempts }}
      rate_limit: ${{ steps.quota.outputs.rate_limit }}
    steps:
      - uses: actions/checkout@v4
        name: 'コードのチェックアウト (Checkout Base Commit)'
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - name: 'AI による修正 (AI Fix)'
        id: ai
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: ai
          round: '1'
          head_sha: ${{ needs.prepare.outputs.base_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          commit_message: 'chore(ai): Issue の指示による修正'
          model_name: ${{ inputs.model_name }}
          aider_version: ${{ inputs.aider_version }}
          max_retries: ${{ inputs.max_retries }}
          initial_delay: ${{ inputs.initial_delay }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}
      # Aider が 1 日の上限などで再試行せずに終了した場合の種別（daily / long）を公開ジョブへ渡す。
      # 作業系ジョブの出力のため、値は既知の種別に限定する
      - name: 'レートリミットの判定 (Detect Rate Limit)'
        id: quota
        if: ${{ failure() }}
        run: |
          kind="$(head -c 16 "$RUNNER_TEMP/aider/rate_limit" 2> /dev/null || true)"
          case "$kind" in daily | long) ;; *) kind="" ;; esac
          echo "rate_limit=${kind}" >> "$GITHUB_OUTPUT"

  verify-1:
    name: '修正の検証 1 回目 (Verify Round 1)'
    needs: [prepare, ai-1]
    if: ${{ needs.ai-1.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        name: 'コードのチェックアウト (Checkout Base Commit)'
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - name: '修正の検証 (Verify)'
        id: verify
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: verify
          round: '1'
          head_sha: ${{ needs.prepare.outputs.base_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          node_version: ${{ inputs.node_version }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}

  # ---- 2 回目: 1 回目の検証が失敗した場合のみ ----
  ai-2:
    name: 'AI による修正 2 回目 (AI Fix Round 2)'
    needs: [prepare, ai-1, verify-1]
    if: ${{ needs.verify-1.outputs.status == 'failed' && inputs.max_fix_rounds >= 2 }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ai.outputs.changed }}
      attempts: ${{ steps.ai.outputs.attempts }}
      rate_limit: ${{ steps.quota.outputs.rate_limit }}
    steps:
      - uses: actions/checkout@v4
        name: 'コードのチェックアウト (Checkout Base Commit)'
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - name: 'AI による修正 (AI Fix)'
        id: ai
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: ai
          round: '2'
          head_sha: ${{ needs.prepare.outputs.base_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          commit_message: 'chore(ai): Issue の指示による修正'
          model_name: ${{ inputs.model_name }}
          aider_version: ${{ inputs.aider_version }}
          max_retries: ${{ inputs.max_retries }}
          initial_delay: ${{ inputs.initial_delay }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}
      # Aider が 1 日の上限などで再試行せずに終了した場合の種別（daily / long）を公開ジョブへ渡す。
      # 作業系ジョブの出力のため、値は既知の種別に限定する
      - name: 'レートリミットの判定 (Detect Rate Limit)'
        id: quota
        if: ${{ failure() }}
        run: |
          kind="$(head -c 16 "$RUNNER_TEMP/aider/rate_limit" 2> /dev/null || true)"
          case "$kind" in daily | long) ;; *) kind="" ;; esac
          echo "rate_limit=${kind}" >> "$GITHUB_OUTPUT"

  verify-2:
    name: '修正の検証 2 回目 (Verify Round 2)'
    needs: [prepare, ai-2]
    if: ${{ needs.ai-2.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        name: 'コードのチェックアウト (Checkout Base Commit)'
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - name: '修正の検証 (Verify)'
        id: verify
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: verify
          round: '2'
          head_sha: ${{ needs.prepare.outputs.base_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          node_version: ${{ inputs.node_version }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}

  # ---- 3 回目: 2 回目の検証が失敗した場合のみ ----
  ai-3:
    name: 'AI による修正 3 回目 (AI Fix Round 3)'
    needs: [prepare, ai-2, verify-2]
    if: ${{ needs.verify-2.outputs.status == 'failed' && inputs.max_fix_rounds >= 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ai.outputs.changed }}
      attempts: ${{ steps.ai.outputs.attempts }}
      rate_limit: ${{ steps.quota.outputs.rate_limit }}
    steps:
      - uses: actions/checkout@v4
        name: 'コードのチェックアウト (Checkout Base Commit)'
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - name: 'AI による修正 (AI Fix)'
        id: ai
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: ai
          round: '3'
          head_sha: ${{ needs.prepare.outputs.base_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          commit_message: 'chore(ai): Issue の指示による修正'
          model_name: ${{ inputs.model_name }}
          aider_version: ${{ inputs.aider_version }}
          max_retries: ${{ inputs.max_retries }}
          initial_delay: ${{ inputs.initial_delay }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}
      # Aider が 1 日の上限などで再試行せずに終了した場合の種別（daily / long）を公開ジョブへ渡す。
      # 作業系ジョブの出力のため、値は既知の種別に限定する
      - name: 'レートリミットの判定 (Detect Rate Limit)'
        id: quota
        if: ${{ failure() }}
        run: |
          kind="$(head -c 16 "$RUNNER_TEMP/aider/rate_limit" 2> /dev/null || true)"
          case "$kind" in daily | long) ;; *) kind="" ;; esac
          echo "rate_limit=${kind}" >> "$GITHUB_OUTPUT"

  verify-3:
    name: '修正の検証 3 回目 (Verify Round 3)'
    needs: [prepare, ai-3]
    if: ${{ needs.ai-3.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        name: 'コードのチェックアウト (Checkout Base Commit)'
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - name: '修正の検証 (Verify)'
        id: verify
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-pr-fix@v1
        with:
          stage: verify
          round: '3'
          head_sha: ${{ needs.prepare.outputs.base_sha }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          node_version: ${{ inputs.node_version }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}

  # 公開: 書き込み権限を持つ。リポジトリのコードは実行せず、作業系ジョブの結果を検証して PR を作る
  publish:
    name: '公開 (Publish: Create PR & Report)'
    needs: [acknowledge, prepare, ai-1, verify-1, ai-2, verify-2, ai-3, verify-3]
    if: ${{ always() && needs.acknowledge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # 作業系ジョブとは別のランナーで、作業の起点のコミットを新しく取得する（状態を引き継がない）
      - name: 'コードのチェックアウト (Checkout Base Commit)'
        if: ${{ needs.prepare.result == 'success' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - name: '作業結果の公開 (Publish Work Result)'
        id: publish
        if: ${{ needs.prepare.result == 'success' }}
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent@v1
        with:
          stage: publish
          base_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          base_sha: ${{ needs.prepare.outputs.base_sha }}
          needs_json: ${{ toJSON(needs) }}
          max_rounds: ${{ inputs.max_fix_rounds }}
          verify_command: ${{ needs.prepare.outputs.verify_command }}
          target_files: ${{ needs.prepare.outputs.target_files }}
          model_name: ${{ inputs.model_name }}
          artifact_prefix: ai-issue-${{ github.run_id }}-${{ github.run_attempt }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_comment_id: ${{ needs.acknowledge.outputs.comment_id }}

      # 状況コメントを最終状態にし、👀 を 🚀（成功）/ 😕（失敗・中断）に切り替える
      - name: '状況表示: 完了 (Status: Finished)'
        if: ${{ always() }}
        continue-on-error: true
        uses: masanori-satake/common-workflows/.github/actions/gemini-ai-agent-status@v1
        with:
          mode: finish
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_comment_id: ${{ needs.acknowledge.outputs.comment_id }}
          reaction_id: ${{ needs.acknowledge.outputs.reaction_id }}
          result: ${{ needs.prepare.result == 'cancelled' && 'cancelled' || (steps.publish.outcome == 'success' && (steps.publish.outputs.pr_url != '' && 'pr' || 'nochange') || (steps.publish.outcome == 'cancelled' && 'cancelled' || 'failure')) }}
          pr_url: ${{ steps.publish.outputs.pr_url }}

      # 状況コメントの書き換えでは通知が飛ばないため、失敗は新規コメントで知らせる
      - name: '失敗時の Issue 通知 (Notify Failure on Issue)'
        if: ${{ always() && github.event.issue.number && (needs.prepare.result == 'failure' || steps.publish.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RATE_LIMIT: ${{ needs.ai-1.outputs.rate_limit || needs.ai-2.outputs.rate_limit || needs.ai-3.outputs.rate_limit }}
        run: |
          case "$RATE_LIMIT" in
            daily) reason=$'\n\n'"Gemini API 無料枠の **1 日あたりの上限** に達したため、AI による修正を中止しました。太平洋時間 0 時（日本時間 16〜17 時）に上限がリセットされた後、\`/ai\` で始まるコメントで再実行してください。" ;;
            long) reason=$'\n\n'"Gemini API のレートリミットの解除まで時間がかかるため、AI による修正を中止しました。しばらく時間をおいてから、\`/ai\` で始まるコメントで再実行してください。" ;;
            *) reason="" ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ Gemini AI エージェントの実行に失敗しました。詳細は [実行ログ]($RUN_URL) を確認してください。${reason}"
