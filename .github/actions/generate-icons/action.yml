name: 'アイコン生成 (Generate PNG Icons)'
description: 'SVG から各サイズの PNG アイコンを生成する共通 composite action。各プロジェクトが個別スクリプトを持たなくて済むよう入力をパラメータ化している。'

inputs:
  svg_path:
    description: '入力 SVG のパス'
    required: false
    default: 'projects/app/assets/icon.svg'
  output_dir:
    description: 'PNG の出力ディレクトリ'
    required: false
    default: 'projects/app/icons'
  file_prefix:
    description: '出力ファイル名の接頭辞（例: icon → icon16.png）'
    required: false
    default: 'icon'
  sizes:
    description: '生成するサイズ（カンマ区切り）'
    required: false
    default: '16,32,48,128'
  bg_color:
    description: '背景色の置換先（指定時のみ bg_source を置換）'
    required: false
    default: ''
  bg_source:
    description: 'bg_color 指定時に置換元とする色'
    required: false
    default: '#386a20'
  python_version:
    description: '使用する Python のバージョン'
    required: false
    default: '3.12'
  playwright_version:
    description: 'インストールする playwright のバージョン（空なら最新）'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 'Python依存ファイルの有無を判定 (Detect Python Deps File)'
      id: pydeps
      shell: bash
      run: |
        if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    # 依存ファイルがある場合のみ pip キャッシュを有効化する
    - name: 'Python環境のセットアップ (Setup Python, with cache)'
      if: ${{ steps.pydeps.outputs.exists == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
        cache: 'pip'

    - name: 'Python環境のセットアップ (Setup Python, no cache)'
      if: ${{ steps.pydeps.outputs.exists == 'false' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: 'Playwright(chromium)のインストール (Install Playwright)'
      shell: bash
      run: |
        if [ -n "${{ inputs.playwright_version }}" ]; then
          pip install "playwright==${{ inputs.playwright_version }}"
        else
          pip install playwright
        fi
        python -m playwright install --with-deps chromium

    - name: 'アイコン生成の実行 (Generate Icons)'
      shell: bash
      env:
        ICON_SVG_PATH: ${{ inputs.svg_path }}
        ICON_OUTPUT_DIR: ${{ inputs.output_dir }}
        ICON_FILE_PREFIX: ${{ inputs.file_prefix }}
        ICON_SIZES: ${{ inputs.sizes }}
        ICON_BG_COLOR: ${{ inputs.bg_color }}
        ICON_BG_SOURCE: ${{ inputs.bg_source }}
      run: |
        python3 "${{ github.action_path }}/generate_png_icons.py"
