name: 'Gemini AI PR 修正 (Gemini AI PR Fix)'
description: 'PR コメントの /ai-fix で CI の失敗を Aider + Gemini で修正し、/ai-bump patch|minor でバージョンを更新して PR ブランチへ push する共通 composite action。PR ブランチ（refs/pull/N/head）をチェックアウト済みであること。'

inputs:
  model_name:
    description: 'Gemini モデル名（gemini/ プレフィックスは不要）'
    required: false
    default: 'gemini-3.8-flash'
  test_command:
    description: 'テストコマンド。Lint・ビルドと組み合わせて修正の検証に使う（空ならテストなし）'
    required: false
    default: ''
  node_version:
    description: '使用する Node.js のバージョン'
    required: false
    default: 'lts/*'
  aider_version:
    description: 'aider-chat のバージョン（固定）'
    required: false
    default: '0.86.2'
  python_version:
    description: 'Aider 実行に使う Python のバージョン'
    required: false
    default: '3.12'
  max_retries:
    description: '429 レートリミット時の最大試行回数'
    required: false
    default: '4'
  initial_delay:
    description: 'リトライ初回の待機秒数（以降 2 倍ずつ増加）'
    required: false
    default: '30'
  gemini_api_key:
    description: 'Google AI Studio の API キー'
    required: true
  github_token:
    description: 'PR 情報・CI ログの取得、push、PR コメント、CI 再実行用トークン'
    required: true
  status_comment_id:
    description: '状況コメントの ID（gemini-ai-agent-status の ack 出力。空なら状況更新しない）'
    required: false
    default: ''

outputs:
  result:
    description: '結果（pushed / nochange / guidance）'
    value: ${{ steps.guidance.outcome == 'success' && 'guidance' || steps.push.outputs.result }}
  commit_url:
    description: 'push したコミットの URL（push しなかった場合は空）'
    value: ${{ steps.push.outputs.commit_url }}

# トークンの扱い: GitHub トークンは「リポジトリのコードを実行しないステップ」にのみ渡す。
# npm ci・Aider・テスト・update-version・git commit（フック）は PR のコード（AI が編集し得る）を
# 実行し得るため、それらのステップにはトークンを渡さない。push はフックを無効化して行う。
runs:
  using: 'composite'
  steps:
    - name: '状況表示: 準備中 (Status: Preparing)'
      shell: bash
      env:
        STATUS_GH_TOKEN: ${{ inputs.github_token }}
        STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        bash "$GITHUB_ACTION_PATH/../gemini-ai-agent-status/status_comment.sh" update \
          "⚙️ 準備中" "PR の情報を確認し、依存関係をインストールしています。"

    - name: 'コマンドの解析と PR の検証 (Resolve Command & Validate PR)'
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.issue.number }}
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: bash "$GITHUB_ACTION_PATH/resolve_request.sh"

    - name: 'Git 作成者の設定 (Configure Git Author)'
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: 'lockfile の有無を判定 (Detect Node Project)'
      id: node_project
      shell: bash
      run: |
        if [ ! -f package.json ]; then
          echo "kind=none" >> "$GITHUB_OUTPUT"
        elif [ -f package-lock.json ]; then
          echo "kind=lockfile" >> "$GITHUB_OUTPUT"
        else
          echo "kind=no-lockfile" >> "$GITHUB_OUTPUT"
        fi

    - name: 'Node.js環境のセットアップ (Setup Node.js)'
      if: ${{ steps.node_project.outputs.kind != 'none' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ steps.node_project.outputs.kind == 'lockfile' && 'npm' || '' }}

    - name: '依存関係のインストール (Install Dependencies)'
      if: ${{ steps.node_project.outputs.kind != 'none' }}
      shell: bash
      env:
        NODE_PROJECT_KIND: ${{ steps.node_project.outputs.kind }}
      run: |
        if [ "$NODE_PROJECT_KIND" = "lockfile" ]; then
          npm ci
        else
          npm install
        fi

    - name: '状況表示: CI ログの解析 (Status: Analyzing CI)'
      shell: bash
      env:
        STATUS_GH_TOKEN: ${{ inputs.github_token }}
        STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        bash "$GITHUB_ACTION_PATH/../gemini-ai-agent-status/status_comment.sh" update \
          "🔎 CI の結果を確認中" "PR の最新コミットで失敗した CI とそのログを集めています。"

    # gh と git だけを使い、リポジトリのコードは実行しない
    - name: '失敗した CI の収集 (Collect CI Failures)'
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        TEST_COMMAND: ${{ inputs.test_command }}
      run: bash "$GITHUB_ACTION_PATH/collect_ci_failures.sh"

    # ---- /ai-fix: AI に修正させない場合（バージョンチェックの失敗・失敗なし）は案内のみ ----
    - name: '対応方法の案内 (Post Guidance)'
      id: guidance
      if: ${{ steps.resolve.outputs.mode == 'fix' && (steps.collect.outputs.failed_count == '0' || steps.collect.outputs.version_check_failed == 'true') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REASON: ${{ steps.collect.outputs.version_check_failed == 'true' && 'version' || 'none' }}
        PENDING_COUNT: ${{ steps.collect.outputs.pending_count }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/post_guidance.sh"

    # ---- /ai-fix: AI による修正 ----
    - name: 'Python環境のセットアップ (Setup Python)'
      if: ${{ steps.resolve.outputs.mode == 'fix' && steps.guidance.outcome == 'skipped' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: 'Aider のインストール (Install Aider)'
      if: ${{ steps.resolve.outputs.mode == 'fix' && steps.guidance.outcome == 'skipped' }}
      shell: bash
      env:
        AIDER_VERSION: ${{ inputs.aider_version }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "aider-chat==${AIDER_VERSION}"
        aider --version
        bash "$GITHUB_ACTION_PATH/../gemini-ai-agent/ensure_aiderignore.sh"

    - name: '状況表示: AI 修正中 (Status: Agent Working)'
      if: ${{ steps.resolve.outputs.mode == 'fix' && steps.guidance.outcome == 'skipped' }}
      shell: bash
      env:
        STATUS_GH_TOKEN: ${{ inputs.github_token }}
        STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        VERIFY_COMMAND: ${{ steps.collect.outputs.verify_command }}
        MAX_RETRIES: ${{ inputs.max_retries }}
      # TARGET_FILES は collect_ci_failures.sh が $GITHUB_ENV に書き出した値（安全な文字のみ）
      run: |
        if [ -n "${TARGET_FILES:-}" ]; then
          detail="対象ファイル: \`${TARGET_FILES}\`"
        else
          detail="対象ファイル: 指定なし（リポジトリ構造から AI が判断）"
        fi
        detail+=$'\n'"修正後に \`${VERIFY_COMMAND:-（検証なし）}\` で検証し、失敗した場合は AI が再修正します。"
        detail+=$'\n'"Gemini API 無料枠の上限（429）に達した場合は自動で待機して再試行するため（最大 ${MAX_RETRIES} 回）、この表示のまま数分続くことがあります。"
        bash "$GITHUB_ACTION_PATH/../gemini-ai-agent-status/status_comment.sh" update \
          "🧠 AI が CI の失敗を修正中" "$detail"

    # GitHub トークンは渡さない（Aider・テストと同じプロセスツリーに置かない）
    - name: 'Aider による修正 (Run Aider to Fix CI)'
      id: aider
      if: ${{ steps.resolve.outputs.mode == 'fix' && steps.guidance.outcome == 'skipped' }}
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        MODEL_NAME: ${{ inputs.model_name }}
        TEST_COMMAND: ${{ steps.collect.outputs.verify_command }}
        MAX_RETRIES: ${{ inputs.max_retries }}
        INITIAL_DELAY: ${{ inputs.initial_delay }}
      run: bash "$GITHUB_ACTION_PATH/../gemini-ai-agent/run_aider.sh"

    - name: 'Aider ログの保存 (Upload Aider Logs)'
      if: ${{ always() && steps.aider.outcome != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: aider-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/aider/
        retention-days: 7
        if-no-files-found: ignore

    # コミットはトークン無しのステップで行う（git フックがリポジトリのコードを実行し得るため）
    - name: '修正のコミット (Commit Fix)'
      if: ${{ steps.aider.outcome == 'success' }}
      shell: bash
      env:
        MODEL_NAME: ${{ inputs.model_name }}
        PR_NUMBER: ${{ github.event.issue.number }}
      run: |
        pathspec=(-- . ':(exclude).aider*' ':(exclude).github/workflows')
        if [ -n "$(git status --porcelain "${pathspec[@]}")" ]; then
          git add -A "${pathspec[@]}"
          git commit -q -m "fix: CI の失敗を修正 (Gemini)" \
            -m "Generated by Aider with gemini/${MODEL_NAME}. Refs #${PR_NUMBER}"
        fi

    - name: '状況表示: AI の作業完了 (Status: Agent Finished)'
      if: ${{ steps.aider.outcome == 'success' }}
      shell: bash
      env:
        STATUS_GH_TOKEN: ${{ inputs.github_token }}
        STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ATTEMPTS: ${{ steps.aider.outputs.attempts }}
        TEST_STATUS: ${{ steps.aider.outputs.test_status }}
      run: |
        case "$TEST_STATUS" in
          passed) test_label="✅ 成功" ;;
          failed) test_label="❌ 失敗" ;;
          *) test_label="⏭️ 未実行" ;;
        esac
        retries=$(( ${ATTEMPTS:-1} - 1 ))
        # 経過（History）には見出しだけが残るため、試行回数と検証結果は見出しに含める
        bash "$GITHUB_ACTION_PATH/../gemini-ai-agent-status/status_comment.sh" update \
          "🔍 AI の作業が完了しました（試行 ${ATTEMPTS:-1} 回・再試行 ${retries} 回・検証: ${test_label}）"

    # ---- /ai-bump: バージョン更新（AI は使わない） ----
    - name: '状況表示: バージョン更新中 (Status: Bumping Version)'
      if: ${{ steps.resolve.outputs.mode == 'bump' }}
      shell: bash
      env:
        STATUS_GH_TOKEN: ${{ inputs.github_token }}
        STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BUMP_TYPE: ${{ steps.resolve.outputs.bump_type }}
      run: |
        bash "$GITHUB_ACTION_PATH/../gemini-ai-agent-status/status_comment.sh" update \
          "🔢 バージョンを更新中（${BUMP_TYPE}）" "update-version スクリプトで関連ファイルを一括更新し、整合性を検証しています。"

    # update-version / check-version はリポジトリのコードのため、トークンは渡さない
    - name: 'バージョンの更新 (Bump Version)'
      id: bump
      if: ${{ steps.resolve.outputs.mode == 'bump' }}
      shell: bash
      env:
        BUMP_TYPE: ${{ steps.resolve.outputs.bump_type }}
        BASE_REF: ${{ steps.resolve.outputs.base_ref }}
        PR_NUMBER: ${{ github.event.issue.number }}
      run: bash "$GITHUB_ACTION_PATH/bump_version.sh"

    # ---- push と報告（リポジトリのコードは実行しない。push はフックを無効化） ----
    - name: 'PR ブランチへの push と CI 再実行 (Push & Re-run CI)'
      id: push
      if: ${{ steps.aider.outcome == 'success' || steps.bump.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MODE: ${{ steps.resolve.outputs.mode }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
        HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        RERUN_WORKFLOWS: ${{ steps.resolve.outputs.mode == 'bump' && steps.collect.outputs.all_workflows || steps.collect.outputs.failed_workflows }}
        MODEL_NAME: ${{ inputs.model_name }}
        TEST_STATUS: ${{ steps.aider.outputs.test_status }}
        ATTEMPTS: ${{ steps.aider.outputs.attempts }}
        VERIFY_COMMAND: ${{ steps.collect.outputs.verify_command }}
        NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        BUMP_TYPE: ${{ steps.resolve.outputs.bump_type }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        STATUS_SCRIPT: ${{ github.action_path }}/../gemini-ai-agent-status/status_comment.sh
        STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
      run: bash "$GITHUB_ACTION_PATH/push_and_report.sh"
