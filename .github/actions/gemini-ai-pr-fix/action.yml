name: 'Gemini AI PR 修正・作業 (Gemini AI PR Fix - Work)'
description: 'PR コメントの /ai-fix（CI の失敗を Aider + Gemini で修正）/ /ai-bump patch|minor（バージョン更新）の作業部分を、実行境界ごとのステージ（prepare / ai / verify / bump）で行う共通 composite action。push は gemini-ai-pr-publish が別ジョブで行う。PR ブランチ（refs/pull/N/head）をチェックアウト済みであること。'

# ステージと実行境界:
#   prepare : PR 情報と CI ログを集め、指示文を作る。読み取りトークンのみ。PR のコードは実行しない
#   ai      : Aider + Gemini で修正する。API キーを持つ。PR のコードは実行しない（npm ci・テストなし、
#             リポジトリの .env / .aider* 設定は退避）。累積の修正を patch として出力する
#   verify  : patch を適用して Lint → テスト → ビルドで検証する。PR のコードを実行する。キー・トークンなし
#   bump    : update-version でバージョンを更新する。PR のコードを実行する。キー・トークンなし
inputs:
  stage:
    description: 'prepare / ai / verify / bump'
    required: true
  round:
    description: 'ai / verify の回数（1〜3）'
    required: false
    default: '1'
  model_name:
    description: 'Gemini モデル名（gemini/ プレフィックスは不要）'
    required: false
    default: 'gemini-3.5-flash-lite'
  test_command:
    description: 'テストコマンド。Lint・ビルドと組み合わせて修正の検証に使う（空ならテストなし）'
    required: false
    default: ''
  verify_command:
    description: 'verify ステージの検証コマンド（prepare の出力を渡す）'
    required: false
    default: ''
  head_sha:
    description: 'ai / verify / bump ステージの作業の起点（prepare の出力を渡す）'
    required: false
    default: ''
  base_ref:
    description: 'bump ステージのベースブランチ（prepare の出力を渡す）'
    required: false
    default: ''
  bump_type:
    description: 'bump ステージの更新種別（prepare の出力を渡す）'
    required: false
    default: ''
  node_version:
    description: '使用する Node.js のバージョン'
    required: false
    default: 'lts/*'
  aider_version:
    description: 'aider-chat のバージョン（固定）'
    required: false
    default: '0.86.2'
  python_version:
    description: 'Aider 実行に使う Python のバージョン'
    required: false
    default: '3.12'
  max_retries:
    description: '429 レートリミット時の最大試行回数'
    required: false
    default: '4'
  initial_delay:
    description: 'リトライ初回の待機秒数（以降 2 倍ずつ増加）'
    required: false
    default: '30'
  gemini_api_key:
    description: 'Google AI Studio の API キー（ai ステージのみ）'
    required: false
    default: ''
  github_token:
    description: 'PR 情報と CI ログの取得用トークン（prepare ステージのみ・読み取り権限）'
    required: false
    default: ''
  artifact_prefix:
    description: 'artifact 名の接頭辞（<prefix>-ctx / -patch-N / -log-N / -patch-bump）'
    required: true
  commit_message:
    description: 'ai ステージのコミットメッセージ（末尾に「(Gemini, N 回目)」を付ける）。Issue 用エージェントも ai / verify ステージを共用する'
    required: false
    default: 'fix: CI の失敗を修正'

outputs:
  # prepare（PR のコードを実行する前に確定するため信頼できる）
  mode:
    description: 'fix / bump'
    value: ${{ steps.resolve.outputs.mode }}
  bump_type:
    description: 'patch / minor（bump のみ）'
    value: ${{ steps.resolve.outputs.bump_type }}
  head_ref:
    description: 'PR のブランチ名'
    value: ${{ steps.resolve.outputs.head_ref }}
  head_sha:
    description: '作業の起点にした PR の head コミット'
    value: ${{ steps.resolve.outputs.head_sha }}
  base_ref:
    description: 'PR のベースブランチ'
    value: ${{ steps.resolve.outputs.base_ref }}
  action:
    description: 'patch（作業する）/ guidance-version / guidance-none（AI では修正しない）'
    value: ${{ steps.decide.outputs.action }}
  pending_count:
    description: '実行中の CI の件数'
    value: ${{ steps.collect.outputs.pending_count }}
  rerun_workflows:
    description: 'push 後に再実行するワークフローファイル名（完了済みの全ワークフロー）'
    value: ${{ steps.collect.outputs.all_workflows }}
  verify_command:
    description: '修正の検証コマンド'
    value: ${{ steps.collect.outputs.verify_command }}
  # ai / verify / bump（公開ジョブ側で検証して使う）
  changed:
    description: 'ai: この回で変更を作ったか（true / false）'
    value: ${{ steps.export_ai.outputs.changed }}
  attempts:
    description: 'ai: Aider の試行回数'
    value: ${{ steps.aider.outputs.attempts }}
  status:
    description: 'verify: 検証結果（passed / failed / skipped）'
    value: ${{ steps.verify.outputs.status }}
  has_patch:
    description: 'bump: 変更があったか（true / false）'
    value: ${{ steps.export_bump.outputs.has_patch }}
  new_version:
    description: 'bump: 更新後のバージョン'
    value: ${{ steps.bump.outputs.new_version }}

runs:
  using: 'composite'
  steps:
    # ======================= prepare =======================
    - name: 'コマンドの解析と PR の検証 (Resolve Command & Validate PR)'
      id: resolve
      if: ${{ inputs.stage == 'prepare' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.issue.number }}
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: bash "$GITHUB_ACTION_PATH/resolve_request.sh"

    - name: '失敗した CI の収集 (Collect CI Failures)'
      id: collect
      if: ${{ inputs.stage == 'prepare' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        TEST_COMMAND: ${{ inputs.test_command }}
      run: bash "$GITHUB_ACTION_PATH/collect_ci_failures.sh"

    - name: '処理内容の決定 (Decide Action)'
      id: decide
      if: ${{ inputs.stage == 'prepare' }}
      shell: bash
      env:
        MODE: ${{ steps.resolve.outputs.mode }}
        FAILED_COUNT: ${{ steps.collect.outputs.failed_count }}
        VERSION_CHECK_FAILED: ${{ steps.collect.outputs.version_check_failed }}
      run: |
        if [ "$MODE" = "fix" ] && [ "$VERSION_CHECK_FAILED" = "true" ]; then
          action=guidance-version
        elif [ "$MODE" = "fix" ] && [ "$FAILED_COUNT" = "0" ]; then
          action=guidance-none
        else
          action=patch
        fi
        echo "action=${action}" >> "$GITHUB_OUTPUT"
        echo "action=${action}"

    - name: 'AI 用の指示文の保存 (Save AI Context)'
      if: ${{ inputs.stage == 'prepare' && steps.resolve.outputs.mode == 'fix' && steps.decide.outputs.action == 'patch' }}
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ai-ctx"
        printf '%s\n' "$AI_PROMPT" > "$RUNNER_TEMP/ai-ctx/prompt.md"
        printf '%s\n' "${TARGET_FILES:-}" > "$RUNNER_TEMP/ai-ctx/target_files.txt"

    - name: 'AI 用の指示文のアップロード (Upload AI Context)'
      if: ${{ inputs.stage == 'prepare' && steps.resolve.outputs.mode == 'fix' && steps.decide.outputs.action == 'patch' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}-ctx
        path: ${{ runner.temp }}/ai-ctx/
        retention-days: 1
        if-no-files-found: error

    # ======================= ai / verify 共通: 前回までの修正の取得と適用 =======================
    - name: 'Git 作成者の設定 (Configure Git Author)'
      if: ${{ inputs.stage != 'prepare' }}
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: '前回までの修正の取得 (Download Previous Patch)'
      if: ${{ (inputs.stage == 'ai' && inputs.round != '1') || inputs.stage == 'verify' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}-patch-${{ inputs.stage == 'ai' && (inputs.round == '3' && '2' || '1') || inputs.round }}
        path: ${{ runner.temp }}/ai-prev-patch

    # 1 回目の ai も、チェックアウトしたコミットが作業の起点と一致することだけは確認する
    - name: '前回までの修正の適用 (Apply Previous Patch)'
      if: ${{ inputs.stage == 'ai' || inputs.stage == 'verify' }}
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "::error::チェックアウトしたコミットが作業の起点と一致しません。"; exit 1; }
        patch="$RUNNER_TEMP/ai-prev-patch/changes.patch"
        if [ -s "$patch" ]; then
          git -c core.hooksPath=/dev/null am --keep-cr --no-3way "$patch"
        fi
        git --no-pager log --oneline "${HEAD_SHA}..HEAD"

    # ======================= ai =======================
    - name: 'AI 用の指示文の取得 (Download AI Context)'
      if: ${{ inputs.stage == 'ai' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}-ctx
        path: ${{ runner.temp }}/ai-ctx

    - name: '前回の検証ログの取得 (Download Previous Verification Log)'
      if: ${{ inputs.stage == 'ai' && inputs.round != '1' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}-log-${{ inputs.round == '3' && '2' || '1' }}
        path: ${{ runner.temp }}/ai-prev-log

    - name: 'この回の指示文の作成 (Build Round Prompt)'
      if: ${{ inputs.stage == 'ai' }}
      shell: bash
      env:
        CTX_DIR: ${{ runner.temp }}/ai-ctx
        ROUND: ${{ inputs.round }}
        PREV_LOG: ${{ runner.temp }}/ai-prev-log/verify.log
        HEAD_SHA: ${{ inputs.head_sha }}
        VERIFY_COMMAND: ${{ inputs.verify_command }}
      run: |
        echo "AI_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        bash "$GITHUB_ACTION_PATH/build_round_prompt.sh"

    - name: 'Python環境のセットアップ (Setup Python)'
      if: ${{ inputs.stage == 'ai' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: 'Aider のインストール (Install Aider)'
      if: ${{ inputs.stage == 'ai' }}
      shell: bash
      env:
        AIDER_VERSION: ${{ inputs.aider_version }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "aider-chat==${AIDER_VERSION}"
        aider --version
        bash "$GITHUB_ACTION_PATH/../gemini-ai-agent/ensure_aiderignore.sh"

    # テストは実行しない（PR のコードを実行しないため）。検証は verify ジョブで行う
    - name: 'Aider による修正 (Run Aider to Fix CI)'
      id: aider
      if: ${{ inputs.stage == 'ai' }}
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        MODEL_NAME: ${{ inputs.model_name }}
        TEST_COMMAND: ''
        MAX_RETRIES: ${{ inputs.max_retries }}
        INITIAL_DELAY: ${{ inputs.initial_delay }}
      run: bash "$GITHUB_ACTION_PATH/../gemini-ai-agent/run_aider.sh"

    - name: 'Aider ログの保存 (Upload Aider Logs)'
      if: ${{ always() && inputs.stage == 'ai' && steps.aider.outcome != 'skipped' }}
      uses: actions/upload-artifact@v4
      with:
        name: aider-logs-${{ github.run_id }}-${{ github.run_attempt }}-round-${{ inputs.round }}
        path: ${{ runner.temp }}/aider/
        retention-days: 7
        if-no-files-found: ignore

    - name: '修正のコミットと patch 出力 (Commit Fix & Export Patch)'
      id: export_ai
      if: ${{ inputs.stage == 'ai' && steps.aider.outcome == 'success' }}
      shell: bash
      env:
        MODEL_NAME: ${{ inputs.model_name }}
        PR_NUMBER: ${{ github.event.issue.number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        ROUND: ${{ inputs.round }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        pathspec=(-- . ':(exclude).aider*' ':(exclude).github/workflows')
        if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
          echo "::warning::.github/workflows/ への変更は GITHUB_TOKEN で push できないため、作業結果から除外します。"
        fi
        if [ -n "$(git status --porcelain "${pathspec[@]}")" ]; then
          git add -A "${pathspec[@]}"
          git -c core.hooksPath=/dev/null commit -q -m "${COMMIT_MESSAGE} (Gemini, ${ROUND} 回目)" \
            -m "Generated by Aider with gemini/${MODEL_NAME}. Refs #${PR_NUMBER}"
        fi
        if [ "$(git rev-parse HEAD)" != "$AI_BASE_SHA" ]; then changed=true; else changed=false; fi
        echo "changed=${changed}" >> "$GITHUB_OUTPUT"
        mkdir -p "$RUNNER_TEMP/ai-patch"
        git format-patch --binary --stdout "${HEAD_SHA}..HEAD" > "$RUNNER_TEMP/ai-patch/changes.patch"
        echo "changed=${changed} cumulative_commits=$(git rev-list --count "${HEAD_SHA}..HEAD")"

    - name: '修正の patch の保存 (Upload Patch)'
      if: ${{ inputs.stage == 'ai' && steps.export_ai.outputs.changed == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}-patch-${{ inputs.round }}
        path: ${{ runner.temp }}/ai-patch/changes.patch
        retention-days: 1
        if-no-files-found: error

    # ======================= verify / bump: Node.js の準備 =======================
    - name: 'lockfile の有無を判定 (Detect Node Project)'
      id: node_project
      if: ${{ inputs.stage == 'verify' || inputs.stage == 'bump' }}
      shell: bash
      run: |
        if [ ! -f package.json ]; then
          echo "kind=none" >> "$GITHUB_OUTPUT"
        elif [ -f package-lock.json ]; then
          echo "kind=lockfile" >> "$GITHUB_OUTPUT"
        else
          echo "kind=no-lockfile" >> "$GITHUB_OUTPUT"
        fi

    # npm キャッシュは使わない。issue_comment で起動したワークフローのキャッシュは既定ブランチの
    # スコープに保存され、リリース等の他のワークフローからも復元される。PR のコードを実行する
    # ジョブでキャッシュを保存すると、細工された依存パッケージがそれらに混入し得るため。
    - name: 'Node.js環境のセットアップ (Setup Node.js)'
      if: ${{ (inputs.stage == 'verify' || inputs.stage == 'bump') && steps.node_project.outputs.kind != 'none' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    # ======================= verify =======================
    # 依存関係のインストールも検証の一部として run_verify.sh で行う（AI の変更で npm ci が
    # 失敗した場合も「検証の失敗」としてログを残し、次の回の AI に渡すため）
    - name: '修正の検証 (Verify Fix)'
      id: verify
      if: ${{ inputs.stage == 'verify' }}
      shell: bash
      env:
        VERIFY_COMMAND: ${{ inputs.verify_command }}
        INSTALL_COMMAND: ${{ steps.node_project.outputs.kind == 'lockfile' && 'npm ci' || (steps.node_project.outputs.kind == 'no-lockfile' && 'npm install --no-package-lock' || '') }}
      run: bash "$GITHUB_ACTION_PATH/run_verify.sh"

    - name: '検証ログの保存 (Upload Verification Log)'
      if: ${{ always() && inputs.stage == 'verify' && steps.verify.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}-log-${{ inputs.round }}
        path: ${{ runner.temp }}/ai-verify/verify.log
        retention-days: 1
        if-no-files-found: error

    # ======================= bump =======================
    - name: 'バージョンの更新 (Bump Version)'
      id: bump
      if: ${{ inputs.stage == 'bump' }}
      shell: bash
      env:
        BUMP_TYPE: ${{ inputs.bump_type }}
        BASE_REF: ${{ inputs.base_ref }}
        PR_NUMBER: ${{ github.event.issue.number }}
      run: bash "$GITHUB_ACTION_PATH/bump_version.sh"

    - name: 'バージョン更新の patch 出力 (Export Bump Patch)'
      id: export_bump
      if: ${{ inputs.stage == 'bump' }}
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        mkdir -p "$RUNNER_TEMP/ai-patch"
        git format-patch --binary --stdout "${HEAD_SHA}..HEAD" > "$RUNNER_TEMP/ai-patch/changes.patch"
        if [ -s "$RUNNER_TEMP/ai-patch/changes.patch" ]; then has_patch=true; else has_patch=false; fi
        echo "has_patch=${has_patch}" >> "$GITHUB_OUTPUT"

    - name: 'バージョン更新の patch の保存 (Upload Bump Patch)'
      if: ${{ inputs.stage == 'bump' && steps.export_bump.outputs.has_patch == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_prefix }}-patch-bump
        path: ${{ runner.temp }}/ai-patch/changes.patch
        retention-days: 1
        if-no-files-found: error
