name: 'コード品質検証 (Code Quality)'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: '共通品質チェック実行 (Execute Base CI)'
    uses: masanori-satake/common-workflows/.github/workflows/base-ci.yml@v1
    # 統一パラメータ（Node=lts/*, Python=3.12, lockfile 自動判定, scripts/ci_checks.py 実行）は
    # base 側のデフォルトに閉じ込められているため、原則 with: は不要。
    # 必要に応じてのみ上書きする:
    # with:
    #   run_typecheck: false   # Vanilla JS で型チェック不要な場合
    #   run_test: false        # ブラウザ導入が必要な E2E を base CI で回さない場合
