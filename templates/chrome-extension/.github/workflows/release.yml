name: 'リリースパッケージ作成 (Release Package)'

on:
  push:
    branches: [ main ]
    paths:
      - 'manifest.json'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: masanori-satake/common-workflows/.github/workflows/base-release.yml@v1
    permissions:
      contents: write
    # 必要に応じてパラメータをオーバーライド可能です（未指定時はデフォルト値が使用されます）
    # with:
    #   project_name: 'my-chrome-extension' # デフォルト: リポジトリ名 (github.event.repository.name)
    #   build_dir: 'dist'                   # デフォルト: 'dist'